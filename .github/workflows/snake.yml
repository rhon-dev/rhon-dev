name: Generate Snake Animation

on:
  # run automatically once a week
  schedule:
    - cron: "0 0 * * 0"

  # allows manual runs from the Actions tab
  workflow_dispatch:

  # generate immediately on merge so the output branch gets created without
  # waiting for the weekly cron. Output goes to the `output` branch, never
  # main, so this cannot re-trigger itself.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publishes the contents of dist/ to the root of the `output` branch,
      # so files are served from raw/output/<file>
      - name: push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
