name: Generate Snake Animation

on:
  # run automatically once a week
  schedule:
    - cron: "0 0 * * 0"

  # allows manual runs from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # red theme: snake + 5 contribution levels (empty -> most)
          outputs: |
            dist/github-snake.svg?color_snake=#e01e1e&color_dots=#ebedf0,#ffb3b3,#ff6b6b,#e01e1e,#8b0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff3b3b&color_dots=#161b22,#5c0a0a,#8b0000,#e01e1e,#ff3b3b

      # publishes the contents of dist/ to the root of the `output` branch,
      # so files are served from raw/output/<file>
      - name: push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
