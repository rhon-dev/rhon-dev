name: Generate Snake Animation

on:
  # refresh daily (08:00 Asia/Manila)
  schedule:
    - cron: "0 0 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # first run right after this workflow lands on main
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # red theme: snake + 5 contribution levels (empty -> most)
          outputs: |
            dist/github-snake.svg?color_snake=#e01e1e&color_dots=#ebedf0,#ffb3b3,#ff6b6b,#e01e1e,#8b0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff3b3b&color_dots=#161b22,#5c0a0a,#8b0000,#e01e1e,#ff3b3b

      # overwrite the committed placeholders in assets/snake so the README never points at a missing file
      - name: commit snake to assets/snake
        run: |
          cp dist/github-snake.svg dist/github-snake-dark.svg assets/snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          git diff --cached --quiet || git commit -m "chore: refresh snake animation [skip ci]"
          git push
