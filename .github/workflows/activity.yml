name: Update Recent Activity

on:
  # every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # first run right after this workflow lands on main
  push:
    branches: [main]
    paths: [".github/workflows/activity.yml"]

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # rewrites the block between <!--START_SECTION:activity--> and <!--END_SECTION:activity--> in README.md
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: "chore: refresh recent activity [skip ci]"
          MAX_LINES: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
