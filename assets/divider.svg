<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#3a0000"/>
      <stop offset="50%" stop-color="#ff1f1f"/>
      <stop offset="100%" stop-color="#3a0000"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1000" height="4" rx="2" fill="url(#red)"/>
  <circle cy="6" r="4" fill="#ffffff">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
